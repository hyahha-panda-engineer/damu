<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>宇連ダム・大島ダム 貯水＆流入量モニタリング</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    /* ダークテーマ＆オレンジ基調のCSS変数 */
    :root {
      --bg-color: #121212;
      --card-bg: #1e1e1e;
      --text-main: #e0e0e0;
      --text-muted: #a0a0a0;
      --accent-orange: #ff9800;
      --accent-yellow: #ffca28;
      --border-color: #333333;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      max-width: 1000px;
      margin: 0 auto;
      padding: 30px 20px;
    }

    h1 {
      font-size: 1.6rem;
      margin-bottom: 24px;
      color: var(--text-main);
      border-bottom: 2px solid var(--border-color);
      padding-bottom: 10px;
    }

    .card {
      background: var(--card-bg);
      padding: 24px;
      border-radius: 12px;
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.4);
      margin-bottom: 24px;
      border: 1px solid var(--border-color);
    }

    .update-time { font-size: 0.9rem; color: var(--text-muted); margin-bottom: 20px; }
    .update-time span { color: var(--accent-orange); font-weight: bold; }

    .metrics-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px;
    }

    .dam-card {
      padding: 20px;
      background-color: rgba(255, 255, 255, 0.03);
      border-radius: 8px;
      border-left: 6px solid;
    }
    .dam-card.uren { border-left-color: var(--accent-orange); }
    .dam-card.oshima { border-left-color: var(--accent-yellow); }

    .dam-title { font-weight: bold; font-size: 1.2rem; margin-bottom: 16px; letter-spacing: 1px; }
    .metric-row { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; }
    .metric-label { font-size: 0.9rem; color: var(--text-muted); }
    .metric-value { font-size: 1.4rem; font-weight: bold; }
    
    .uren-text { color: var(--accent-orange); }
    .oshima-text { color: var(--accent-yellow); }

    .chart-container { position: relative; height: 450px; width: 100%; }
    .error-msg { color: #f44336; text-align: center; padding: 40px; }
  </style>
</head>
<body>

  <h1>豊川用水 貯水状況＆流入量ダッシュボード</h1>

  <div class="card">
    <div class="update-time">最新測定日時: <span id="latest-time">-</span></div>
    
    <div class="metrics-grid">
      <!-- 宇連ダム -->
      <div class="dam-card uren">
        <div class="dam-title">宇連ダム</div>
        <div class="metric-row">
          <span class="metric-label">貯水率</span>
          <span class="metric-value uren-text" id="uren-rate">- %</span>
        </div>
        <div class="metric-row">
          <span class="metric-label">貯水量</span>
          <span class="metric-value" id="uren-vol">- 千m³</span>
        </div>
        <div class="metric-row">
          <span class="metric-label">現在流入量</span>
          <span class="metric-value" id="uren-inflow">- m³/s</span>
        </div>
      </div>

      <!-- 大島ダム -->
      <div class="dam-card oshima">
        <div class="dam-title">大島ダム</div>
        <div class="metric-row">
          <span class="metric-label">貯水率</span>
          <span class="metric-value oshima-text" id="oshima-rate">- %</span>
        </div>
        <div class="metric-row">
          <span class="metric-label">貯水量</span>
          <span class="metric-value" id="oshima-vol">- 千m³</span>
        </div>
        <div class="metric-row">
          <span class="metric-label">現在流入量</span>
          <span class="metric-value" id="oshima-inflow">- m³/s</span>
        </div>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="chart-container">
      <canvas id="damChart"></canvas>
    </div>
  </div>

  <script>
    // Chart.js の全体設定（ダークテーマ用）
    Chart.defaults.color = '#a0a0a0';
    Chart.defaults.font.family = '"Helvetica Neue", Arial, sans-serif';

    async function initDashboard() {
      try {
        const response = await fetch('./data/dam_data.json?t=' + Date.now());
        if (!response.ok) throw new Error(`HTTP Error: ${response.status}`);
        
        const data = await response.json();
        if (!Array.isArray(data) || data.length === 0) throw new Error('データがありません');

        const latest = data[data.length - 1];
        document.getElementById('latest-time').textContent = latest.datetime || '-';

        const updateMetrics = (prefix, damData) => {
          if (!damData) return;
          document.getElementById(`${prefix}-rate`).textContent = `${damData.storage_rate ?? '-'} %`;
          document.getElementById(`${prefix}-vol`).textContent = `${(damData.storage_volume ?? 0).toLocaleString()} 千m³`;
          document.getElementById(`${prefix}-inflow`).textContent = `${damData.inflow ?? '-'} m³/s`;
        };

        updateMetrics('uren', latest.uren);
        updateMetrics('oshima', latest.oshima);

        const labels = data.map(item => item.datetime ? item.datetime.slice(5) : '');
        
        const ctx = document.getElementById('damChart').getContext('2d');
        new Chart(ctx, {
          type: 'line',
          data: {
            labels: labels,
            datasets: [
              {
                label: '宇連 貯水率 (%)',
                data: data.map(item => item.uren?.storage_rate ?? null),
                borderColor: '#ff9800',
                backgroundColor: 'rgba(255, 152, 0, 0.1)',
                yAxisID: 'yRate',
                tension: 0.3,
                fill: true
              },
              {
                label: '大島 貯水率 (%)',
                data: data.map(item => item.oshima?.storage_rate ?? null),
                borderColor: '#ffca28',
                backgroundColor: 'rgba(255, 202, 40, 0.1)',
                yAxisID: 'yRate',
                tension: 0.3,
                fill: true
              },
              {
                label: '宇連 流入量 (m³/s)',
                data: data.map(item => item.uren?.inflow ?? null),
                borderColor: '#f44336', // 流入量は赤系オレンジで区別
                borderDash: [4, 4],
                yAxisID: 'yInflow',
                tension: 0.3
              },
              {
                label: '大島 流入量 (m³/s)',
                data: data.map(item => item.oshima?.inflow ?? null),
                borderColor: '#ffeb3b', 
                borderDash: [4, 4],
                yAxisID: 'yInflow',
                tension: 0.3
              }
            ]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            interaction: { mode: 'index', intersect: false },
            scales: {
              yRate: {
                type: 'linear', position: 'left', min: 0, max: 100,
                title: { display: true, text: '貯水率 (%)', color: '#e0e0e0' },
                grid: { color: '#333333' }
              },
              yInflow: {
                type: 'linear', position: 'right', min: 0,
                title: { display: true, text: '流入量 (m³/s)', color: '#e0e0e0' },
                grid: { drawOnChartArea: false } 
              },
              x: {
                grid: { color: '#333333' }
              }
            }
          }
        });

      } catch (error) {
        console.error(error);
        document.querySelector('.chart-container').innerHTML = 
          `<p class="error-msg">データの読み込みに失敗しました: ${error.message}</p>`;
      }
    }

    document.addEventListener('DOMContentLoaded', initDashboard);
  </script>
</body>
</html>
