name: Update Dam Data & Deploy Pages

on:
  schedule:
    # 2時間おきに実行 (UTC)
    - cron: '0 */2 * * *'
  workflow_dispatch: # 手動実行用

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  # 1. データ取得とデプロイ準備
  fetch-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Fetch Dam Data
        run: python scripts/fetch_dam_data.py

      # 更新されたデータを含めてリポジトリにCommit&Push（履歴残し用）
      - name: Commit and Push json
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/dam_data.json
          if git status --porcelain | grep -q 'data/dam_data.json'; then
            git commit -m "auto: update dam data"
            git push
          fi

      # GitHub Pages用のアートファクト（静的ファイル）をアップロード
      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.' # リポジトリ直下の index.html や data/ をそのまま公開

  # 2. Pagesへのデプロイ実行
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: fetch-and-build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4